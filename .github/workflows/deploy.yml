name: Deploy to GitHub Pages

# Manual, because the private-terms scan can only run locally: run `npm run verify` first.
on: workflow_dispatch

# An explicit block drops every permission it doesn't name, and checkout reads the repo.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Served from nay244.github.io/nay-ascii/. With a domain, remove this and change metadataBase in src/app/layout.tsx.
    env:
      NEXT_PUBLIC_BASE_PATH: /nay-ascii
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
